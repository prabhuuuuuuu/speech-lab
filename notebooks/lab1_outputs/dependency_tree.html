/* =====================================================
   HEADER
   ===================================================== */

.header {

    color: #555;

    font-size: 13px;

/* =====================================================
   TREE AREA
   ===================================================== */

.tree-container {

    width: 100%;

    height:
        calc(100% - 90px);

    overflow: auto;

    padding: 25px;
}

svg {

    display: block;

    background: white;

    border:
        1px solid #d5d5d5;

    border-radius: 12px;

    box-shadow:
        0 3px 12px
        rgba(0,0,0,0.08);
}


/* =====================================================
   EDGES
   ===================================================== */

.edge {

    stroke: #333;

    stroke-width: 2.5;

    fill: none;

    pointer-events: none;
}


/* =====================================================
   ARROW
   ===================================================== */

marker {

    overflow: visible;
}


/* =====================================================
   DEPENDENCY LABEL
   ===================================================== */

.dependency-label {

    font-size: 13px;

    font-weight: bold;

    fill: #555;

    text-anchor: middle;

    pointer-events: none;

    paint-order: stroke;

    stroke: white;

    stroke-width: 5px;

    stroke-linejoin: round;
}


/* =====================================================
   NODES
   ===================================================== */

.node {

    cursor: grab;
}

.node:active {

    cursor: grabbing;
}

.node circle {

    fill: white;

    stroke: #222;

    stroke-width: 2.5;
}

.node:hover circle {

    fill: #f1f5f9;

    stroke-width: 3.5;
}


/* =====================================================
   ROOT
   ===================================================== */

.root-node circle {

    fill: #e8f0ff;

    stroke: #1d4ed8;

    stroke-width: 4;
}


/* =====================================================
   NODE TEXT
   ===================================================== */

.word {

    font-size: 15px;

    font-weight: bold;

    text-anchor: middle;

    dominant-baseline: middle;

    pointer-events: none;
}

.pos {

    font-size: 11px;

    fill: #666;

    text-anchor: middle;

    pointer-events: none;
}


/* =====================================================
   SELECTED NODE
   ===================================================== */

.selected circle {

    stroke: #dc2626;

    stroke-width: 4;
}

</style>

/* =====================================================
   GET SVG COORDINATES
   ===================================================== */

function getSVGPoint(event) {

    const point =
        svg.createSVGPoint();

    point.x =
        event.clientX;

    point.y =
        event.clientY;

    const matrix =
        svg
            .getScreenCTM()
            .inverse();

    return point.matrixTransform(matrix);
}


/* =====================================================
   UPDATE EDGES
   ===================================================== */

function updateEdges() {

    relationships.forEach(connection => {

        const parent =
            positions[connection.parent];

        const child =
            positions[connection.child];

        if (!parent || !child) {
            return;
        }


        const dx =
            child.x - parent.x;

        const dy =
            child.y - parent.y;

        const distance =
            Math.sqrt(
                dx * dx +
                dy * dy
            );

        if (distance === 0) {
            return;
        }


        const radius = 48;


        /*
         * Arrow starts at edge of parent circle
         */

        const startX =
            parent.x +
            (dx / distance) *
            radius;

        const startY =
            parent.y +
            (dy / distance) *
            radius;


        /*
         * Arrow ends at edge of child circle
         */

        const endX =
            child.x -
            (dx / distance) *
            radius;

        const endY =
            child.y -
            (dy / distance) *
            radius;


        /*
         * Update arrow
         */

        const edge =
            document.getElementById(
                `edge-${connection.parent}-${connection.child}`
            );

        if (edge) {

            edge.setAttribute(
                "x1",
                startX
            );

            edge.setAttribute(
                "y1",
                startY
            );

            edge.setAttribute(
                "x2",
                endX
            );

            edge.setAttribute(
                "y2",
                endY
            );

        }


        /*
         * Update dependency label
         */

        const label =
            document.getElementById(
                `label-${connection.parent}-${connection.child}`
            );

        if (label) {

            label.setAttribute(
                "x",
                (startX + endX) / 2
            );

            label.setAttribute(
                "y",
                (startY + endY) / 2 - 8
            );

        }

    });

}

   DRAGGING STATE
   ===================================================== */

let draggedNode = null;

let dragOffsetX = 0;

let dragOffsetY = 0;


/* =====================================================
   START DRAG
   ===================================================== */

document
    .querySelectorAll(".node")
    .forEach(node => {

        node.addEventListener(
            "pointerdown",
            function(event) {

                event.preventDefault();

                draggedNode =
                    Number(
                        this.dataset.node
                    );


                const point =
                    getSVGPoint(event);


                dragOffsetX =
                    positions[draggedNode].x -
                    point.x;


                dragOffsetY =
                    positions[draggedNode].y -
                    point.y;


                this.setPointerCapture(
                    event.pointerId
                );


                document
                    .querySelectorAll(".node")
                    .forEach(n => {

                        n.classList.remove(
                            "selected"
                        );

                    });


                this.classList.add(
                    "selected"
                );

            }
        );

    });


/* =====================================================
   DRAG
   ===================================================== */

svg.addEventListener(
    "pointermove",
    function(event) {

        if (draggedNode === null) {
            return;
        }


        const point =
            getSVGPoint(event);


        let x =
            point.x +
            dragOffsetX;


        let y =
            point.y +
            dragOffsetY;


        const radius = 48;


        /*
         * Keep node inside canvas
         */

        x = Math.max(
            radius,
            Math.min(
                1400 - radius,
                x
            )
        );


        y = Math.max(
            radius,
            Math.min(
                950 - radius,
                y
            )
        );


        positions[draggedNode].x = x;

        positions[draggedNode].y = y;


        const node =
            document.getElementById(
                `node-${draggedNode}`
            );


        if (node) {

            node.setAttribute(
                "transform",
                `translate(${x},${y})`
            );

        }


        updateEdges();

    }
);


/* =====================================================
   END DRAG
   ===================================================== */

svg.addEventListener(
    "pointerup",
    function() {

        draggedNode = null;

    }
);


svg.addEventListener(
    "pointercancel",
    function() {

        draggedNode = null;

    }
);


/* =====================================================
   RESET
   ===================================================== */

svg.addEventListener(
    "dblclick",
    function(event) {

        if (event.target !== svg) {
            return;
        }


        for (
            const [node, position]
            of Object.entries(initialPositions)
        ) {

            positions[node].x =
                position.x;

            positions[node].y =
                position.y;


            const element =
                document.getElementById(
                    `node-${node}`
                );


            if (element) {

                element.setAttribute(
                    "transform",
                    `translate(${position.x},${position.y})`
                );

            }

        }


        document
            .querySelectorAll(".node")
            .forEach(n => {

                n.classList.remove(
                    "selected"
                );

            });


        updateEdges();

    }
);


/* =====================================================
   INITIAL DRAW
   ===================================================== */

updateEdges();

</script>

</body>

</html>
